---
layout: default
title: articles
permalink: /articles/
---

<div class="prompt-line">ls ./articles</div>
<h1>articles</h1>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <a class="post-list-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <div class="post-list-date">{{ post.date | date: "%b %-d, %Y" }}</div>
      <p class="post-list-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
    </li>
  {% else %}
    <li>No articles yet.</li>
  {% endfor %}
</ul>
