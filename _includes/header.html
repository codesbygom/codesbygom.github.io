<aside class="sidebar">
  <nav>
    {% for item in site.nav %}
      <a class="nav-icon{% if page.url == item.url %} active{% endif %}"
         href="{{ item.url | relative_url }}" title="{{ item.title }}">
        <span class="nav-icon-glyph">
          {% case item.title %}
            {% when 'home' %}~
            {% when 'projects' %}/
            {% when 'articles' %}{}
            {% else %}#
          {% endcase %}
        </span>
        <span class="nav-icon-label">{{ item.title }}</span>
      </a>
    {% endfor %}
  </nav>

  <div class="sidebar-bottom">
    <button class="pulse-resume" onclick="window.print()" title="download resume.pdf">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a1 1 0 011 1v9.586l2.293-2.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L11 13.586V4a1 1 0 011-1zM5 19a1 1 0 011-1h12a1 1 0 110 2H6a1 1 0 01-1-1z"/></svg>
      <span>resume</span>
    </button>
    {% if site.author.github %}
    <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener" title="github">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.809 1.304 3.495.997.108-.775.418-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.31 24 12c0-6.627-5.373-12-12-12"/></svg>
      <span>github</span>
    </a>
    {% endif %}
  </div>
</aside>
